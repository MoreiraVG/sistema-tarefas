<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="caixa">
    <header>
      <h1>Minhas Tarefas</h1>
      <p id="contador" class="contador"></p>
    </header>

    <form id="form">
      <input id="titulo" type="text" placeholder="O que você precisa fazer?" maxlength="120" autocomplete="off" required>
      <button type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <ul id="lista"></ul>
    
    <div id="vazio" class="vazio" hidden>
      <div class="vazio-icone">✨</div>
      <p>Você não tem tarefas no momento.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
